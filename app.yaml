# ☕ Coffee Shop: a small but real web app for Kubernetes demos.
# Everything is in this one file: Namespace, app code (ConfigMap), Deployment, Service.
apiVersion: v1
kind: Namespace
metadata:
  name: coffee
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coffee-shop-code
  namespace: coffee
data:
  app.py: |
    import os, sys, socket, datetime
    from http.server import BaseHTTPRequestHandler, HTTPServer

    PORT = os.environ.get("APP_PORT")
    if not PORT:
        print("FATAL: APP_PORT environment variable is not set. Cannot start web server.", flush=True)
        sys.exit(1)

    SHOP = os.environ.get("SHOP_NAME", "Coffee Shop")
    VERSION = os.environ.get("APP_VERSION", "v1")

    cache_mb = int(os.environ.get("MENU_CACHE_MB", "0"))
    if cache_mb:
        print(f"Warming menu cache: {cache_mb} MB ...", flush=True)
        menu_cache = "x" * (cache_mb * 1024 * 1024)
        print("Menu cache ready", flush=True)

    MENU = [("☕", "Espresso", 2.50), ("🥛", "Cappuccino", 3.20), ("🍵", "Matcha Latte", 3.80),
            ("🧊", "Iced Americano", 3.00), ("🥐", "Butter Croissant", 2.20), ("🍫", "Hot Chocolate", 2.90)]

    def page():
        items = "".join(
            f'<div class="item"><span class="emoji">{e}</span><span class="name">{n}</span>'
            f'<span class="price">${p:.2f}</span></div>' for e, n, p in MENU)
        return f"""<!doctype html><html><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1"><title>{SHOP}</title>
    <style>
    body{{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#1c1410;color:#f5ece4;
         display:flex;justify-content:center;padding:40px 16px}}
    .card{{max-width:560px;width:100%;background:#2b201a;border-radius:20px;padding:32px;
          box-shadow:0 20px 60px rgba(0,0,0,.5)}}
    h1{{margin:0;font-size:36px}} .tag{{color:#d9a066;margin:6px 0 24px}}
    .status{{display:inline-block;background:#1f7a3a;color:#fff;padding:6px 14px;border-radius:99px;font-weight:600}}
    .item{{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #3d2f26;font-size:18px}}
    .emoji{{font-size:26px}} .name{{flex:1}} .price{{color:#d9a066;font-weight:700}}
    .meta{{margin-top:24px;font-size:14px;color:#b9a99b;line-height:1.7}}
    code{{background:#3d2f26;padding:2px 8px;border-radius:6px;color:#f5ece4}}
    </style></head><body><div class="card">
    <h1>☕ {SHOP}</h1><div class="tag">Fresh coffee, served by Kubernetes</div>
    <span class="status">● Online</span>
    <div style="margin-top:20px">{items}</div>
    <div class="meta">Version: <code>{VERSION}</code><br>
    Served by pod: <code>{socket.gethostname()}</code><br>
    Time: <code>{datetime.datetime.now().strftime('%H:%M:%S')}</code></div>
    </div></body></html>"""

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                body, ctype = b"ok", "text/plain"
            else:
                body, ctype = page().encode(), "text/html; charset=utf-8"
            self.send_response(200)
            self.send_header("Content-Type", ctype)
            self.end_headers()
            self.wfile.write(body)
        def log_message(self, fmt, *args):
            print(f"{self.address_string()} - {fmt % args}", flush=True)

    print(f"{SHOP} {VERSION} is open! Listening on port {PORT}", flush=True)
    HTTPServer(("", int(PORT)), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coffee-shop
  namespace: coffee
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: coffee-shop
  template:
    metadata:
      labels:
        app: coffee-shop
    spec:
      containers:
        - name: web
          image: python:3.12-alpine
          command: ["python", "/app/app.py"]
          env:
            - name: APP_PORT
              value: "8080"
            - name: SHOP_NAME
              value: "DevOps Coffee"
            - name: APP_VERSION
              value: "v1"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: coffee-shop-code
---
apiVersion: v1
kind: Service
metadata:
  name: coffee-shop
  namespace: coffee
spec:
  selector:
    app: coffee-shop
  ports:
    - port: 80
      targetPort: 8080
